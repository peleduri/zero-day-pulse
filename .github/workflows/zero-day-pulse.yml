name: Zero Day Pulse

# M1: deny all permissions by default; each job grants only what it needs
permissions: {}

# A scheduled run and a manual run must never race on state/last_run.json
concurrency:
  group: zero-day-pulse
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Hours to look back for new vulnerabilities'
        default: '24'
        required: false
      max_enrich:
        description: 'Max findings to enrich with Parallel AI'
        default: '10'
        required: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        # H3: pinned to immutable SHA (v4.3.1)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        # M5: fetch-depth 1 (default) — full history not needed

      - name: Set up Python 3.11
        # H3: pinned to immutable SHA (v6.2.0)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # Offline suite (HTTP mocked); a red suite blocks report publishing
        run: python -m pytest tests/

      - name: Run Zero Day Pulse
        id: pulse
        # C1: inputs passed via env vars, never interpolated into the shell command
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
          MAX_ENRICH: ${{ github.event.inputs.max_enrich || '10' }}
        run: |
          python main.py \
            --lookback-hours "$LOOKBACK_HOURS" \
            --max-enrich "$MAX_ENRICH" \
            --output-dir reports

      - name: Commit reports, state and HTML dashboard
        id: commit
        # M2: only stage latest.*, changes.json, state/ and docs/ — timestamped files are gitignored.
        # Nothing to commit is still success; a failed push fails the step (so no tracker comment).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json reports/latest.md reports/changes.json docs/ state/
          if git diff --cached --quiet; then
            echo "No new files to commit"
          else
            git commit -m "pulse: add report $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
          fi

      - name: Upload report artifacts
        # H3: pinned to immutable SHA (v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zero-day-pulse-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload Pages artifact
        # H3: pinned to immutable SHA (v5.0.0)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/

      - name: Update tracking issue
        # Body update + change comment only when the run AND the commit/push succeeded,
        # so the issue never shows (or comments on) a report that was not pushed.
        if: ${{ !cancelled() && steps.pulse.outcome == 'success' && steps.commit.outcome == 'success' }}
        # H3: pinned to immutable SHA (v9.0.0)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          # Read via process.env — never interpolated into the script source
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const TITLE = '🚨 Zero Day Pulse — Active Vulnerability Tracker';
            const latestMd = 'reports/latest.md';
            if (!fs.existsSync(latestMd)) {
              console.log('No report generated — skipping issue update');
              return;
            }
            const { owner, repo } = context.repo;
            const runUrl   = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const pagesUrl = `https://${owner}.github.io/${repo}/`;
            let body = fs.readFileSync(latestMd, 'utf8');
            body += `\n\n---\n[Live dashboard](${pagesUrl}) · [Raw JSON](https://github.com/${owner}/${repo}/blob/main/reports/latest.json) · [Action run](${runUrl})`;
            body = body.substring(0, 65000);

            // Newest-first list of open labelled issues, matched on the EXACT tracker title.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'zero-day-pulse', state: 'open',
              sort: 'created', direction: 'desc', per_page: 100,
            });
            const tracker = issues.find(i => !i.pull_request && i.title === TITLE);
            if (!tracker) {
              const { data: issue } = await github.rest.issues.create({
                owner, repo, title: TITLE, body, labels: ['zero-day-pulse'],
              });
              console.log(`Created tracking issue #${issue.number}`);
              return;  // the new body already contains this run's changes
            }
            await github.rest.issues.update({ owner, repo, issue_number: tracker.number, body });
            console.log(`Updated body of tracking issue #${tracker.number}`);

            // Comment only for THIS run's non-empty change list.
            const changesJson = 'reports/changes.json';
            if (!fs.existsSync(changesJson)) {
              console.log('No changes.json — no comment');
              return;
            }
            let data;
            try {
              data = JSON.parse(fs.readFileSync(changesJson, 'utf8'));
            } catch (e) {
              console.log(`Unreadable changes.json (${e.message}) — no comment`);
              return;
            }
            if (String(data.run_id) !== String(process.env.RUN_ID)) {
              console.log(`changes.json is from run ${data.run_id}, not ${process.env.RUN_ID} — no comment`);
              return;
            }
            if (!Array.isArray(data.changes) || data.changes.length === 0) {
              console.log('No changes since last run — no comment');
              return;
            }
            const changesMd = 'reports/changes.md';
            const list = fs.existsSync(changesMd) ? fs.readFileSync(changesMd, 'utf8').trim() : '';
            if (!list) {
              console.log('changes.md missing or empty — no comment');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: tracker.number,
              body: `${list}\n\n[Action run](${runUrl})`.substring(0, 65000),
            });
            console.log(`Commented ${data.changes.length} change(s) on #${tracker.number}`);

  deploy-pages:
    needs: pulse
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # H3: pinned to immutable SHA (v5.0.0)
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
