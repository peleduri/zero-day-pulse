# ── Signal keywords ───────────────────────────────────────────────────────────

zero_day_keywords:
  # Generic zero-day signals
  - zero-day
  - zero day
  - 0-day
  - 0day
  - actively exploited
  - exploited in the wild
  - in the wild
  - no patch
  - unpatched
  - before patch
  - patch bypass
  - nation-state
  - state-sponsored
  # Cloud-specific active exploitation signals
  - cloud breach
  - mass exploitation
  - abuse in the wild
  - attackers are exploiting
  - threat actors exploiting
  # AI / agent exploitation signals
  - prompt injection
  - indirect prompt injection
  - tool poisoning
  - agent hijacking
  - jailbreak
  - system prompt leak
  - model exfiltration
  - malicious extension
  - malicious plugin
  - malicious mcp

high_severity_keywords:
  # Generic severity signals
  - critical
  - remote code execution
  - unauthenticated rce
  - pre-auth
  - wormable
  - supply chain
  - backdoor
  # Cloud infrastructure signals
  - container escape
  - container breakout
  - privilege escalation
  - cluster takeover
  - kubernetes
  - lateral movement
  - credential theft
  - iam bypass
  - metadata service
  - imds
  - ssrf
  - exposed secret
  - secret leak
  - token hijack
  - cross-tenant
  - tenant isolation
  # Cloud platform signals
  - aws
  - azure
  - gcp
  - eks
  - gke
  - aks
  - ecr
  - acr
  - cloud run
  - lambda
  - fargate
  # Infrastructure signals
  - terraform
  - helm
  - registry poisoning
  - image poisoning
  - dependency confusion
  - typosquatting
  # AI / coding agent signals
  - mcp server
  - mcp vulnerability
  - ai agent
  - copilot
  - cursor
  - codeium
  - github copilot
  - vscode extension
  - jetbrains plugin
  - ide extension
  - rag poisoning
  - context injection
  - shadow prompt
  - training data poisoning
  - model backdoor
  - pickle exploit
  - unsafe deserialization
  - jupyter
  - notebook execution
  - ai supply chain
  - llm vulnerability
  - embedding attack
  # Network/appliance exploitation signals
  - authentication bypass
  - auth bypass
  - command injection        # also covers "os command injection" (substring match)
  - arbitrary code execution
  - path traversal
  - directory traversal
  - memory corruption
  - buffer overflow
  - credential disclosure
  - session hijacking

# Product/vendor watchlist: an entry mentioning one of these AND carrying a CVE id
# survives the filter, but is NOT marked high-severity — these are priority terms,
# not severity claims. Broad substrings (vpn, firewall, bare "cisco"/"f5") are
# deliberately excluded to avoid flooding the report.
priority_product_keywords:
  # Palo Alto ("pan-os" only — bare "panos" substring-matches the Greek given name)
  - pan-os
  - globalprotect
  - panorama
  # Cisco (product names, never bare "cisco")
  - cisco asa
  - adaptive security appliance
  - firepower
  - ios xe
  - ios-xe
  - nx-os
  - anyconnect
  # Fortinet
  - fortios
  - fortigate
  - fortiproxy
  - fortimanager
  - fortianalyzer
  - fortiweb
  # Ivanti / Pulse
  - ivanti connect secure
  - ivanti policy secure
  - pulse secure
  - ivanti epmm
  - cloud services appliance
  # Check Point
  - check point gateway
  - gaia os
  - quantum security gateway
  # Juniper (no public advisory feed — these catch news/KEV coverage)
  - junos
  - juniper srx
  - session smart router
  # Citrix / NetScaler (no public advisory feed)
  - netscaler
  - citrix adc
  - citrix gateway
  # F5 (no public advisory feed)
  - big-ip
  - big-iq
  - f5os
  - tmui
  # SonicWall (no public advisory feed; "sma 100" also substring-matches "sma 1000")
  - sonicwall
  - sonicos
  - sma 100

cisa_kev_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
